name: AquaSenseAPI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e Testes
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: |
          dotnet restore AquaSenseAPI/AquaSenseAPI.csproj
          dotnet restore AquaSenseAPI.Tests/AquaSenseAPI.Tests.csproj

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.17

      - name: Aguardar SQL Server
        run: sleep 30

      - name: Criar banco de testes
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AquaSenseDB;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=True"
        run: dotnet ef database update --project AquaSenseAPI/AquaSenseAPI.csproj

      - name: Compilar aplicação
        run: dotnet build AquaSenseAPI/AquaSenseAPI.csproj --configuration Release --no-restore

      - name: Executar testes
        env:
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=AquaSenseDB;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;MultipleActiveResultSets=True"
        run: dotnet test AquaSenseAPI.Tests/AquaSenseAPI.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Login no Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: aquasenseacr2026.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir imagem Docker
        run: docker build -t aquasenseacr2026.azurecr.io/aquasenseapi:latest ./AquaSenseAPI

      - name: Enviar imagem para o ACR
        run: docker push aquasenseacr2026.azurecr.io/aquasenseapi:latest

  deploy-staging:
    name: Deploy Staging
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no Azure App Service - Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: aquasense-staging-marcela
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          images: aquasenseacr2026.azurecr.io/aquasenseapi:latest

  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy no Azure App Service - Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: aquasense-production-marcela
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          images: aquasenseacr2026.azurecr.io/aquasenseapi:latest